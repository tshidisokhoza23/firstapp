name: TJ
options:
  bundleIdPrefix: com.tpsk
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  objectVersion: 56

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0

targets:
  TJ:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Info.plist
      properties:
        GIDClientID: "303703683011-6ksjg0b8uakesl9a821ri05tokrg41f2.apps.googleusercontent.com"
        GIDServerClientID: "303703683011-g2p7atop0uackslr2eq9fnsja5jlfk7u.apps.googleusercontent.com"
        CFBundleURLTypes:
          - CFBundleURLName: Google
            CFBundleURLSchemes:
              - com.googleusercontent.apps.303703683011-6ksjg0b8uakesl9a821ri05tokrg41f2
    dependencies:
      - package: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tpsk.TJ
        PRODUCT_NAME: TJ
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Info.plist
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSContactsUsageDescription: "TJ uses your contacts to show saved names and find people already on TJ."
        INFOPLIST_KEY_NSCameraUsageDescription: "TJ uses the camera for video calls, stories, and media sharing."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "TJ uses your location to show people nearby on Court."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "TJ uses the microphone to record voice notes and calls."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "TJ uses your photos and videos for chats, stories, posts, and shorts."
