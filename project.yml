name: TJ
options:
  bundleIdPrefix: com.tpsk
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  objectVersion: 56

targets:
  TJ:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tpsk.TJ
        PRODUCT_NAME: TJ
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "TJ uses your location to show people nearby on Court."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "TJ uses the microphone to record voice notes and calls."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "TJ uses your photos and videos for chats, stories, posts, and shorts."
        INFOPLIST_KEY_CFBundleURLTypes:
          - CFBundleURLName: Google
            CFBundleURLSchemes:
              - com.googleusercontent.apps.303703683011-g2p7atop0uackslr2eq9fnsja5jlfk7u
