name: Verify iOS Compilation

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  check-build:
    name: Verify iOS Compilation
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml

      - name: Ensure Compatibility
        run: |
          sed -i '' 's/objectVersion = [0-9]*/objectVersion = 56/g' TJ.xcodeproj/project.pbxproj
          sed -i '' 's/compatibilityVersion = ".*";/compatibilityVersion = "Xcode 15.0";/g' TJ.xcodeproj/project.pbxproj

      - name: Compile App
        run: |
          xcodebuild clean build \
            -project TJ.xcodeproj \
            -scheme TJ \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="$PWD/build"

      - name: Package into .ipa
        run: |
          mkdir -p Payload
          cp -r "$PWD/build/Release-iphoneos/TJ.app" Payload/
          zip -r TJ.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TJ-iOS-App
          path: TJ.ipa

# ==============================================================================
# LOCAL UBUNTU USB INSTALLATION COMMANDS (REFERENCE)
# ==============================================================================
# # 1. Check CLI deployment tools:
# # which ideviceinstaller idevicepair ios-deploy
#
# # 2. Detect connected iPhone device UDID:
# # idevice_id -l
# # Output: 00008030-000E415C1446802E
#
# # 3. Validate USB pairing with iPhone:
# # idevicepair validate
# # Output: SUCCESS: Validated pairing with device 00008030-000E415C1446802E
#
# # 4. Find compiled & signed IPA file:
# # find /home/pablito -name "*.ipa" 2>/dev/null
# # Output: /home/pablito/Downloads/TJ-signed.ipa
#
# # 5. Inspect IPA size:
# # ls -lh /home/pablito/Downloads/TJ-signed.ipa
#
# # 6. Install signed IPA onto iPhone via USB:
# # ideviceinstaller -u 00008030-000E415C1446802E -i /home/pablito/Downloads/TJ-signed.ipa
# # Output: Install: InstallComplete (100%)
#
# # 7. Verify installed app bundle ID:
# # ideviceinstaller -u 00008030-000E415C1446802E -l | grep com.tpsk.TJ
# # Output: com.tpsk.TJ.PNX9HSN9VY, "1", "TJ"
# ==============================================================================
