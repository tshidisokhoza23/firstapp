name: Build iOS App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml

      - name: Ensure Compatibility
        run: |
          sed -i '' 's/objectVersion = [0-9]*/objectVersion = 56/g' TJ.xcodeproj/project.pbxproj
          sed -i '' 's/compatibilityVersion = ".*";/compatibilityVersion = "Xcode 15.0";/g' TJ.xcodeproj/project.pbxproj

      - name: Build App (Unsigned)
        run: |
          # Absolute BUILD_DIR. A relative path is resolved inside each Swift
          # package checkout, so Google Sign-In resource bundles never land
          # where the app copy phase looks for them.
          xcodebuild clean build \
            -project TJ.xcodeproj \
            -scheme TJ \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="$PWD/build"

      - name: Package into .ipa
        run: |
          mkdir -p Payload
          cp -r "$PWD/build/Release-iphoneos/TJ.app" Payload/
          zip -r TJ.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TJ-ipa
          path: TJ.ipa
