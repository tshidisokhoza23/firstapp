name: Android Prod Release

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  prod-release:
    name: Assemble Prod Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Assemble Prod Release
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
        run: ./gradlew :app:assembleProdRelease --stacktrace

      - name: Upload Prod Release APK
        uses: actions/upload-artifact@v4
        with:
          name: TJ-Android-Prod
          path: app/build/outputs/apk/prod/release/*.apk
          if-no-files-found: error
