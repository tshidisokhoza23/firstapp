app = 'tj-turn-server'
primary_region = 'jnb'

[build]
  dockerfile = 'Dockerfile'

[[services]]
  protocol = 'udp'
  internal_port = 3478

  [[services.ports]]
    port = 3478

[[services]]
  protocol = 'tcp'
  internal_port = 3478

  [[services.ports]]
    port = 3478

[[services]]
  protocol = 'tcp'
  internal_port = 5349

  [[services.ports]]
    port = 5349

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
